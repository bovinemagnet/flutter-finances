# Signed release builds, packages and provenance for a version tag (vX.Y.Z).
#
# Fails closed: the preflight job stops the whole release when the tag is
# malformed or any signing secret is missing, every signing job re-checks its
# own secrets, and the Android build refuses to fall back to the debug key.
# The result is a draft GitHub release; publishing it (and staging store
# roll-outs) is a manual step described in tool/packaging/README.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  JAVA_VERSION: "25"

jobs:
  preflight:
    name: Preflight (tag and secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Derive the version from the tag
        env:
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "build-number=$RUN_NUMBER"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
      - name: Require every signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                      MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      APPSTORE_API_KEY_P8_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID \
                      WINDOWS_CERTIFICATE_PFX_BASE64 WINDOWS_CERTIFICATE_PASSWORD \
                      IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD \
                      IOS_APP_PROFILE_BASE64 IOS_SHARE_EXTENSION_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Release secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

  android:
    name: Android (signed)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build-number }}
      # build.gradle.kts fails the build if key.properties is missing.
      FINANCE_REQUIRE_RELEASE_SIGNING: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Write the upload keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set"; exit 1; }
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          umask 077
          cat >apps/finance_app/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build App Bundle and APK
        working-directory: apps/finance_app
        run: |
          flutter build appbundle --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Verify the release signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apk=apps/finance_app/build/app/outputs/flutter-apk/app-release.apk
          aab=apps/finance_app/build/app/outputs/bundle/release/app-release.aab
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep 'certificate DN'
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          # Upload keys are self-signed, so only require a verified signature.
          jarsigner -verify "$aab" | grep -q 'jar verified'
          if jarsigner -verify -verbose -certs "$aab" | grep -q 'CN=Android Debug'; then
            echo "::error::App Bundle is signed with the debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/finance-app-$VERSION-android.apk"
          cp "$aab" "dist/finance-app-$VERSION-android.aab"
      - name: Android dependency inventory
        working-directory: apps/finance_app/android
        run: ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath >"$GITHUB_WORKSPACE/dist/inventory-android-release-runtime.txt"
      - name: Remove signing material
        if: always()
        run: rm -f apps/finance_app/android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS (signed and notarised)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build-number }}
      APP: apps/finance_app/build/macos/Build/Products/Release/finance_app.app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MACOS_SIGNING_IDENTITY"
      - name: Build
        working-directory: apps/finance_app
        run: flutter build macos --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Sign with Developer ID (hardened runtime)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          sign() {
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" \
              --sign "$MACOS_SIGNING_IDENTITY" "$@"
          }
          # Inside out: nested frameworks and libraries first, then the app.
          find "$APP/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' item; do sign "$item"; done
          sign --entitlements apps/finance_app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Notarise and staple
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for name in APPSTORE_API_KEY_P8_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode >"$key"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$key" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait --output-format json)
          echo "$result"
          status=$(echo "$result" | jq -r .status)
          if [[ "$status" != Accepted ]]; then
            id=$(echo "$result" | jq -r .id)
            xcrun notarytool log "$id" --key "$key" --key-id "$APPSTORE_API_KEY_ID" \
              --issuer "$APPSTORE_API_ISSUER_ID" || true
            rm -f "$key"
            echo "::error::Notarisation finished with status $status"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/finance-app-$VERSION-macos.zip"
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS (signed IPA with the share extension)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build-number }}
      APP_BUNDLE_ID: com.paulsnow.finance.app
      EXTENSION_BUNDLE_ID: com.paulsnow.finance.app.ShareExtension
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # receive_sharing_intent is distributed as a Swift package only.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Add the share extension target
        working-directory: apps/finance_app
        run: |
          gem install --user-install --no-document xcodeproj
          ruby ios/tool/add_share_extension.rb
      - name: Import the distribution certificate and profiles
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD \
                      IOS_APP_PROFILE_BASE64 IOS_SHARE_EXTENSION_PROFILE_BASE64 IOS_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          install_profile() {
            local file="$RUNNER_TEMP/$1.mobileprovision" plist uuid name
            printf '%s' "$2" | base64 --decode >"$file"
            plist=$(security cms -D -i "$file")
            uuid=$(plutil -extract UUID raw - <<<"$plist")
            name=$(plutil -extract Name raw - <<<"$plist")
            cp "$file" "$profiles/$uuid.mobileprovision"
            rm -f "$file"
            echo "$name"
          }
          app_profile=$(install_profile app "$IOS_APP_PROFILE_BASE64")
          extension_profile=$(install_profile extension "$IOS_SHARE_EXTENSION_PROFILE_BASE64")
          {
            echo "APP_PROFILE=$app_profile"
            echo "EXTENSION_PROFILE=$extension_profile"
          } >>"$GITHUB_ENV"
      - name: Use manual signing for the release build
        working-directory: apps/finance_app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            profiles = { "Runner" => ENV.fetch("APP_PROFILE"), "ShareExtension" => ENV.fetch("EXTENSION_PROFILE") }
            profiles.each do |target_name, profile|
              target = project.targets.find { |t| t.name == target_name } or abort "#{target_name} target missing"
              target.build_configurations.select { |c| c.name == "Release" }.each do |config|
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("IOS_TEAM_ID")
                config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = profile
              end
            end
            project.save
          '
          cat >"$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$APP_PROFILE</string>
              <key>$EXTENSION_BUNDLE_ID</key><string>$EXTENSION_PROFILE</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Build the IPA
        working-directory: apps/finance_app
        run: |
          flutter build ipa --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Check the signature and the embedded extension
        run: |
          ipa=$(find apps/finance_app/build/ios/ipa -name '*.ipa' | head -n 1)
          [[ -n "$ipa" ]] || { echo "::error::No IPA was produced"; exit 1; }
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$app/PlugIns/ShareExtension.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'Authority=Apple Distribution'
          mkdir -p dist
          cp "$ipa" "dist/finance-app-$VERSION-ios.ipa"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows (signed MSIX)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build-number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/finance_app
        run: flutter build windows --release --build-name $env:VERSION --build-number $env:BUILD_NUMBER
      - name: Package and sign the MSIX
        working-directory: apps/finance_app
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'WINDOWS_CERTIFICATE_PFX_BASE64', 'WINDOWS_CERTIFICATE_PASSWORD') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "$name is not set" }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          # MSIX versions have four numeric parts; drop any pre-release suffix.
          $msixVersion = ($env:VERSION -replace '-.*$', '') + '.0'
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dart run msix:create --build-windows false --install-certificate false `
            --certificate-path $pfx --certificate-password $env:WINDOWS_CERTIFICATE_PASSWORD `
            --version $msixVersion --output-path $out --output-name "finance-app-$env:VERSION-windows-x64"
          if ($LASTEXITCODE -ne 0) { throw "msix:create failed" }
      - name: Verify the signature
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v "dist\finance-app-$env:VERSION-windows-x64.msix"
          if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed" }
      - name: Remove signing material
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'signing.pfx')
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux (.tar.gz and .deb)
    needs: preflight
    # Ubuntu 24.04 LTS is the named Linux baseline (PRD section 15).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            desktop-file-utils appstream
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/finance_app
        run: flutter build linux --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Package
        run: tool/packaging/linux/build-deb.sh --version "$VERSION" --require-deb --out dist
      - name: Check the package installs on the baseline
        run: |
          sudo apt-get install -y "./dist/finance-app_${VERSION}_amd64.deb"
          test -x /usr/bin/finance-app
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error

  inventory:
    name: Dependency inventory
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Record client and server dependencies
        run: |
          mkdir -p dist
          (cd apps/finance_app && flutter pub deps --json) >dist/inventory-flutter-pub-deps.json
          cp pubspec.lock dist/inventory-pubspec.lock
          ./gradlew --no-daemon -q :server:app:dependencies --configuration runtimeClasspath \
            >dist/inventory-server-app-runtime.txt
          ./gradlew --no-daemon -q :server:finance-core:dependencies --configuration runtimeClasspath \
            >dist/inventory-server-finance-core-runtime.txt
          flutter --version --machine >dist/inventory-flutter-sdk.json
          java -version 2>dist/inventory-java.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-inventory
          path: dist/
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [preflight, android, ios, macos, windows, linux, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          name: Finance ${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
