# Developer profile: local PostgreSQL and MinIO, API and worker in one
# process. Start with SPRING_PROFILES_ACTIVE=local.
spring:
  datasource:
    url: ${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${FINANCE_DB_USERNAME:finance}
    password: ${FINANCE_DB_PASSWORD:finance}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FINANCE_OIDC_ISSUER_URI:http://localhost:8180/realms/finance}

finance:
  storage:
    endpoint: ${FINANCE_S3_ENDPOINT:http://localhost:9000}
    access-key: ${FINANCE_S3_ACCESS_KEY:minioadmin}
    secret-key: ${FINANCE_S3_SECRET_KEY:minioadmin}
    bucket: ${FINANCE_S3_BUCKET:finance-local}
    path-style-access: true
    create-bucket: true
  worker:
    enabled: ${FINANCE_WORKER_ENABLED:true}
